name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install uv==0.11.31
      - run: uv sync --frozen --extra api --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -m 'not integration'
      - run: uv run python -m build
      - run: uvx --from bandit==1.9.4 bandit -q -r src/sigorbit
      - run: uv export --frozen --no-dev --extra api --no-emit-project -o /tmp/runtime.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit -r /tmp/runtime.txt --progress-spinner off
