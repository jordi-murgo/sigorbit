[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sigorbit"
version = "0.2.4"
description = "Rotation-robust handwritten-signature embeddings with SO(2) canonicalization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jordi Murgó", email = "jordi.murgo@gmail.com" }]
maintainers = [{ name = "Jordi Murgó", email = "jordi.murgo@gft.com" }]
keywords = ["signature", "embeddings", "rotation-invariance", "equivariant-cnn", "biometrics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.7",
  "numpy>=1.26",
  "pillow>=12.3",
  "e2cnn>=0.2.3,<0.3",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/jordi-murgo/sigorbit"
Repository = "https://github.com/jordi-murgo/sigorbit.git"
Documentation = "https://github.com/jordi-murgo/sigorbit#readme"
Issues = "https://github.com/jordi-murgo/sigorbit/issues"
Changelog = "https://github.com/jordi-murgo/sigorbit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.1",
  "python-multipart>=0.0.32",
]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
sigorbit-api = "sigorbit.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/sigorbit"]

[tool.hatch.build.targets.sdist]
include = ["src/sigorbit", "tests", "docs", "scripts", "README.md", "LICENSE", "NOTICE", "SECURITY.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "MODEL_PROVENANCE.json", "CITATION.cff", "CITATION.bib", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: loads the full release checkpoint"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
