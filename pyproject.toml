[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sigorbit"
version = "0.1.0"
description = "Rotation-robust handwritten-signature embeddings with SO(2) canonicalization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SigOrbit contributors" }]
keywords = ["signature", "embeddings", "rotation-invariance", "equivariant-cnn", "biometrics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "pillow>=10",
  "e2cnn>=0.2.3,<0.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
sigorbit-api = "sigorbit.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/sigorbit"]

[tool.hatch.build.targets.sdist]
include = ["src/sigorbit", "tests", "docs", "scripts", "README.md", "LICENSE", "NOTICE", "MODEL_PROVENANCE.json", "CITATION.cff", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: loads the full release checkpoint"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
